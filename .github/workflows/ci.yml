name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: PYTHONPATH=src python -m pytest tests

  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions and check metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          . wheel-env/bin/activate
          python -m pip install --no-index "$GITHUB_WORKSPACE"/dist/*.whl
          python -Im lmc5 add --title "Wheel probe" --content "Remember cobalt." > added.json
          lmc5 recall cobalt > hits.json
          python - <<'PY'
          import json
          from pathlib import Path

          added = json.loads(Path("added.json").read_text())
          hits = json.loads(Path("hits.json").read_text())
          assert hits and hits[0]["id"] == added["id"]
          assert hits[0]["content"] == "Remember cobalt."
          PY

  aml-serving:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional serving dependencies
        run: |
          python -m pip install --require-hashes -r extras/aml/requirements.lock
          python -m pip install -e .[dev]
          python -m pip check
      - name: Test AML adapter against local fake providers
        run: PYTHONPATH=src python -m pytest extras/aml/tests -q

  postgres-integrity:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: lmc5_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest psycopg2-binary
      - run: PYTHONPATH=src python -m pytest -q tests/test_pg_memory_integrity.py
        env:
          LMC5_TEST_PG_DSN: host=127.0.0.1 port=5432 dbname=lmc5_test user=postgres
